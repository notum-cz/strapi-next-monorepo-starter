packages: ["packages/*", "apps/*", "qa/**"]
allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  core-js: true
  core-js-pure: true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAge: 2880
resolutionMode: highest
minimumReleaseAgeExclude: []

overrides:
  # Single copy of the React 19 types across the workspace (Strapi and
  # Docusaurus run React 18 at runtime but share the UI's type definitions).
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  # CodeMirror breaks when two copies of state/view load (Strapi admin editors).
  "@codemirror/state": 6.7.6
  "@codemirror/view": 6.43.15
  # The OpenTelemetry JS SDK 2.x line (pulled in by @sentry/*, @azure/monitor-*
  # and @repo/logging) peers `@opentelemetry/api <1.10.0`, but `^1.9` ranges float
  # to 1.10. Keep one 1.9.x copy until those parents move to SDK 3.x.
  "@opentelemetry/api": 1.9.1
  # @docusaurus/theme-mermaid accepts `mermaid >=11.6.0`, which floats to the
  # breaking 12.x line (new layout/colours, `defaultRenderer` removed) while
  # @mermaid-js/layout-elk 0.2 peers ^11. Hold 11.x until Docusaurus moves to 12.
  # 11.17.2 also fixes the 11.15 advisories (GHSA-rhh3/6x64/3rrr/2v8p/c4c3).
  mermaid: 11.17.2
  # ── Security floors ────────────────────────────────────────────────────────
  # Each entry uses a `<fixed` selector, so it only lifts vulnerable copies and
  # never drags a newer pin down. They exist because a parent pins the
  # vulnerable version (exactly or with `~`), so the copy cannot float up on its
  # own. Drop an entry once its parent ships a patched pin.
  #   ckeditor5  - @_sh/strapi-plugin-ckeditor 8.0.0 pins `~48.4.0`, open to
  #                GHSA-rh54-vffm-5fvp (XSS, high) and GHSA-v6mg-96c6-gmpq.
  #                Fixed in 48.5.1. (The 47.7.x line is CKEditor's paid LTS
  #                edition and refuses to load with the GPL key.)
  "ckeditor5@<48.5.1": 48.5.3
  #   dompurify  - @_sh/strapi-plugin-ckeditor 8.0.0 pins 3.4.12 exactly, open to
  #                GHSA-cg2g-xh64-v4q7 (critical), GHSA-mrv2-3pqr-j5jr (high)
  #                and three lower ones. Fixed in 3.4.17.
  "dompurify@<3.4.17": 3.4.17
  #   lodash     - @notum-cz/strapi-plugin-tiptap-editor 1.3.0 depends on
  #                @strapi/design-system 2.2.0, which pins 4.17.23 exactly, open
  #                to GHSA-r5fr-rjxr-66jc (`_.template` code injection, high) and
  #                GHSA-f23m-r3pf-42rh. Fixed in 4.18.1. Drop it once the plugin
  #                moves to design-system 2.3+.
  "lodash@<4.18.1": 4.18.1
  #   zod        - the AI SDK under @strapi/content-type-builder resolves 4.4.3,
  #                open to GHSA-mrhx-c7xc-m3w5 (memory exhaustion, high). Fixed in
  #                4.6.6. Scoped to 4.x: Strapi's own zod 3.25 has no patched 3.x.
  "zod@>=4.0.0 <4.6.6": 4.6.7
  #   happy-dom  - @tiptap/html (server-side HTML rendering in apps/ui) and vitest
  #                still resolve 20.8.9, open to GHSA-834v-8h66-3h79 (host code
  #                execution) and GHSA-c8p4-j97h-3vg8 (SSRF), both high and fixed
  #                only in 21.x. Both parents already accept ^21.0.4.
  "happy-dom@<21.0.4": 21.0.4
  #   tinypool   - @docusaurus/core 3.10.2 (docs build) depends on ^1.0.2, open
  #                to GHSA-5gmw-xhrv-c9v3 and GHSA-85c8-ppgw-ccpr (prototype
  #                pollution to RCE, critical). Fixed only in 2.1.2.
  "tinypool@<2.1.2": 2.2.0
  #   adm-zip    - strapi-plugin-config-sync 3.3.0 depends on ^0.5.16, open to
  #                GHSA-7q85-xj36-vmfc, GHSA-j5f4-cc29-5x44 and three other high
  #                advisories. Fixed in 0.6.1. (GHSA-vwc7-r8mq-g2x9 has no fix.)
  "adm-zip@<0.6.1": 0.6.1
  #   axios      - get-sitemap-links 1.1.0 (QA tests) pins the 0.21 line, open to
  #                ten high advisories (SSRF, credential leaks, prototype
  #                pollution). The 0.x line is fixed in 0.33.0.
  "axios@<0.33.0": 0.35.0
  #   basic-ftp  - get-uri 6 (proxy-agent under Lighthouse CI) depends on ^5,
  #                open to GHSA-c475-qrg2-pj4r (high) and two medium ones. Fixed
  #                in 6.2.4, which get-uri 8 already uses.
  "basic-ftp@<6.2.4": 6.2.6
  #   serialize-javascript - copy-webpack-plugin and css-minimizer-webpack-plugin
  #                (docs build) depend on ^6, open to GHSA-5c6j-r48x-rmvq (RCE,
  #                high), GHSA-qj8w-gfj5-8c6v and GHSA-m5mm-p8h7-m29v. Fixed in 7.1.3.
  "serialize-javascript@<7.1.3": 7.1.4
  #   @opentelemetry/instrumentation-http - @azure/monitor-opentelemetry 1.21.0
  #                depends on ^0.221.0, open to GHSA-3v2p-hm54-8qcq (sensitive
  #                data in logs, medium). Fixed in 0.222.0.
  "@opentelemetry/instrumentation-http@>=0.204.0 <0.222.0": 0.222.0
  #   glob / minimatch - @strapi/core, rimraf, eslint and others resolve glob 13
  #                and minimatch 9/10, open to GHSA-3g3m-2fjr-6pw4 and
  #                GHSA-g3hv-75wg-m249 (medium). Fixed only in glob 14.0.2 and
  #                minimatch 11.0.1. Older majors (glob 7, minimatch 3) are not
  #                affected and stay as they are.
  "glob@>=9.0.0 <14.0.2": 14.0.6
  "minimatch@>=7.0.0 <11.0.1": 11.0.8
  #   uuid       - sockjs (webpack-dev-server, docs dev server) depends on ^8,
  #                open to GHSA-w5hq-g745-h8pq (medium). Fixed in 11.1.1, the
  #                last line that still ships CommonJS.
  "uuid@<11.1.1": 11.1.1
  #   katex      - mermaid 11 (docs) depends on ^0.16, open to
  #                GHSA-238p-pmpm-9mq7 (low). Fixed in 0.18.2.
  "katex@<0.18.2": 0.18.11

packageExtensions:
  "@hookform/resolvers":
    peerDependencies:
      zod: "*"
  "@uiw/codemirror-extensions-basic-setup":
    peerDependenciesMeta:
      "@codemirror/autocomplete":
        optional: true
      "@codemirror/language":
        optional: true
      "@codemirror/lint":
        optional: true
      "@codemirror/search":
        optional: true
      "@codemirror/state":
        optional: true
      "@codemirror/view":
        optional: true
  "@uiw/react-codemirror":
    peerDependenciesMeta:
      "@babel/runtime":
        optional: true
      "@codemirror/state":
        optional: true
      "@codemirror/theme-one-dark":
        optional: true
      "@codemirror/view":
        optional: true
      codemirror:
        optional: true

peerDependencyRules:
  allowedVersions:
    eslint: ^10.0.0
    react: ">=18 <20"
    react-dom: ">=18 <20"
    styled-components: ">=6.0.0 <7"
    typescript: ">=5.4.0 <6"
    zod: ">=3.25.67 <5"
