packages: ["packages/*", "apps/*", "qa/**"]
allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  core-js: true
  core-js-pure: true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAge: 2880
resolutionMode: highest
minimumReleaseAgeExclude: []

overrides:
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  "@codemirror/state": 6.7.4
  "@codemirror/view": 6.43.11
  # Transitive-only security bumps. None of these is a direct dependency of a
  # workspace package, so they can only be raised through an override:
  #   postcss   - restricts previous-source-map loading to the `opts.from`
  #               folder and fixes prototype hijacking in `postcss.fromJSON()`
  #               (8.5.17/8.5.18/8.5.23). Reached via the Tailwind and webpack
  #               chains, which allow any ^8.4.
  #   dompurify - fixes hook removal, clone-guard bypass and DOM clobbering
  #               via `ownerDocument` during IN_PLACE sanitization (3.4.13).
  #               Reached via mermaid in apps/docs.
  #   hono      - fixes cross-user SSR data disclosure in `memo()`, a Connection
  #               header leak in the proxy helper and ReDoS in the language and
  #               CORS middlewares (all patched in 4.12.34). Reached via
  #               @modelcontextprotocol/sdk, which allows any ^4.11.4.
  #   @hono/...  - fixes serve-static path traversal on Windows via an encoded
  #               backslash (patched in 1.19.15). Held at 1.x on purpose: the
  #               2.x line is a major the MCP SDK has not moved to.
  #   happy-dom - fixes unsanitized export names being interpolated as executable
  #               code in ECMAScriptModuleCompiler (20.8.8) and page-origin
  #               cookies leaking into cross-origin `fetch` (20.8.9). Reached via
  #               vitest, which allows any ^20. `@tiptap/html` also requires
  #               ^20.8.9 as an optional peer, so this doubles as the peer fix.
  # Drop each entry once every parent resolves to the patched version on its own.
  postcss: 8.5.26
  dompurify: 3.4.14
  hono: 4.13.4
  "@hono/node-server": 1.19.17
  happy-dom: 20.8.9
  # Security bumps that apps/ui and apps/strapi already pin directly, but which
  # Strapi pins to an older EXACT version in its own dependency tree. An exact
  # pin can never float up, so without an override the patched release reaches
  # only the workspace packages and the Strapi runtime keeps the vulnerable copy:
  #   sharp      - `@strapi/upload` pins 0.35.3, which bundles the vulnerable
  #                libheif (GHSA-rgj7-g3m4-5g8c). This is Strapi's image
  #                processing path, so the advisory is live in the CMS.
  #   nodemailer - `@strapi/provider-email-nodemailer` and
  #                `@strapi/provider-email-sendmail` pin 9.0.1, which is older
  #                than the 9.0.5 apps/strapi pinned. Leaves the addressparser
  #                ReDoS (GHSA-2x7j-588g-ccc2) and the resolveContent access
  #                bypass (GHSA-8m3c-c648-2xjj) reachable on the real email path.
  #   qs         - `@strapi/admin`, `@strapi/core`, `@strapi/upload` and
  #                `@strapi/permissions` all pin 6.15.3, keeping the array-limit
  #                bypass (GHSA-x5fp-wj9c-mxmx) in the admin request chain.
  # Each is a patch/minor within the major Strapi already depends on. Drop each
  # entry once Strapi ships a release that pins the patched version itself.
  sharp: 0.35.4
  nodemailer: 9.1.1
  qs: 6.16.0

packageExtensions:
  "@hookform/resolvers":
    peerDependencies:
      zod: "*"
  "@uiw/codemirror-extensions-basic-setup":
    peerDependenciesMeta:
      "@codemirror/autocomplete":
        optional: true
      "@codemirror/language":
        optional: true
      "@codemirror/lint":
        optional: true
      "@codemirror/search":
        optional: true
      "@codemirror/state":
        optional: true
      "@codemirror/view":
        optional: true
  "@uiw/react-codemirror":
    peerDependenciesMeta:
      "@babel/runtime":
        optional: true
      "@codemirror/state":
        optional: true
      "@codemirror/theme-one-dark":
        optional: true
      "@codemirror/view":
        optional: true
      codemirror:
        optional: true

peerDependencyRules:
  allowedVersions:
    eslint: ^9.39.0
    react: ">=18 <20"
    react-dom: ">=18 <20"
    styled-components: ">=6.0.0 <7"
    typescript: ">=5.4.0 <6"
    zod: ">=3.25.67 <5"
