packages: ["packages/*", "apps/*", "qa/**"]
allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  core-js: true
  core-js-pure: true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAge: 2880
resolutionMode: highest
minimumReleaseAgeExclude: []

overrides:
  # Single copy of the React 19 types across the workspace (Strapi and
  # Docusaurus run React 18 at runtime but share the UI's type definitions).
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  # CodeMirror breaks when two copies of state/view load (Strapi admin editors).
  "@codemirror/state": 6.7.6
  "@codemirror/view": 6.43.15
  # The OpenTelemetry JS SDK 2.x line (pulled in by @sentry/*, @azure/monitor-*
  # and @repo/logging) peers `@opentelemetry/api <1.10.0`, but `^1.9` ranges float
  # to 1.10. Keep one 1.9.x copy until those parents move to SDK 3.x.
  "@opentelemetry/api": 1.9.1
  # @docusaurus/theme-mermaid accepts `mermaid >=11.6.0`, which floats to the
  # breaking 12.x line (new layout/colours, `defaultRenderer` removed) while
  # @mermaid-js/layout-elk 0.2 peers ^11. Hold 11.x until Docusaurus moves to 12.
  # 11.17.2 also fixes the 11.15 advisories (GHSA-rhh3/6x64/3rrr/2v8p/c4c3).
  mermaid: 11.17.2
  # ── Security floors ────────────────────────────────────────────────────────
  # Each entry uses a `<fixed` selector, so it only lifts vulnerable copies and
  # never drags a newer pin down. They exist because a parent pins the
  # vulnerable version (exactly or with `~`), so the copy cannot float up on its
  # own. Drop an entry once its parent ships a patched pin.
  #   ckeditor5  - @_sh/strapi-plugin-ckeditor 8.0.0 pins `~48.4.0`, open to
  #                GHSA-rh54-vffm-5fvp (XSS, high) and GHSA-v6mg-96c6-gmpq.
  #                Fixed in 48.5.1. (The 47.7.x line is CKEditor's paid LTS
  #                edition and refuses to load with the GPL key.)
  "ckeditor5@<48.5.1": 48.5.3
  #   nodemailer - @strapi/provider-email-nodemailer and -sendmail 5.61 pin
  #                10.0.9 exactly, open to GHSA-4g23/39m8 (10.0.10),
  #                GHSA-4ffr/g73g (10.0.13) and GHSA-8c8m/m943/85x2 (10.1.4).
  "nodemailer@<10.1.4": 10.4.0
  #   dompurify  - @_sh/strapi-plugin-ckeditor 8.0.0 pins 3.4.12 exactly, open to
  #                GHSA-cg2g-xh64-v4q7 (critical), GHSA-mrv2-3pqr-j5jr (high)
  #                and three lower ones. Fixed in 3.4.17.
  "dompurify@<3.4.17": 3.4.17
  #   lodash     - @strapi/design-system 2.2.0 pins 4.17.23 exactly, open to
  #                GHSA-r5fr-rjxr-66jc (`_.template` code injection, high) and
  #                GHSA-f23m-r3pf-42rh. Fixed in 4.18.1.
  "lodash@<4.18.1": 4.18.1
  #   zod        - the AI SDK under @strapi/content-type-builder resolves 4.4.3,
  #                open to GHSA-mrhx-c7xc-m3w5 (memory exhaustion, high). Fixed in
  #                4.6.6. Scoped to 4.x: Strapi's own zod 3.25 has no patched 3.x.
  "zod@>=4.0.0 <4.6.6": 4.6.7
  #   happy-dom  - @tiptap/html (server-side HTML rendering in apps/ui) and vitest
  #                still resolve 20.8.9, open to GHSA-834v-8h66-3h79 (host code
  #                execution) and GHSA-c8p4-j97h-3vg8 (SSRF), both high and fixed
  #                only in 21.x. Both parents already accept ^21.0.4.
  "happy-dom@<21.0.4": 21.0.4

packageExtensions:
  "@hookform/resolvers":
    peerDependencies:
      zod: "*"
  "@uiw/codemirror-extensions-basic-setup":
    peerDependenciesMeta:
      "@codemirror/autocomplete":
        optional: true
      "@codemirror/language":
        optional: true
      "@codemirror/lint":
        optional: true
      "@codemirror/search":
        optional: true
      "@codemirror/state":
        optional: true
      "@codemirror/view":
        optional: true
  "@uiw/react-codemirror":
    peerDependenciesMeta:
      "@babel/runtime":
        optional: true
      "@codemirror/state":
        optional: true
      "@codemirror/theme-one-dark":
        optional: true
      "@codemirror/view":
        optional: true
      codemirror:
        optional: true

peerDependencyRules:
  allowedVersions:
    eslint: ^10.0.0
    react: ">=18 <20"
    react-dom: ">=18 <20"
    styled-components: ">=6.0.0 <7"
    typescript: ">=5.4.0 <6"
    zod: ">=3.25.67 <5"
