packages: ["packages/*", "apps/*", "qa/**"]
allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  core-js: true
  core-js-pure: true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAge: 4320
resolutionMode: highest
minimumReleaseAgeExclude:
  - "@notum-cz/strapi-plugin-smart-populate@1.0.1"
  - "nodemailer@9.0.1"

  # TEMPORARY — everything below is inside the `minimumReleaseAge` quarantine
  # and is pinned to an exact version on purpose, so that only the releases
  # reviewed in this PR are let through and any *later* release of the same
  # package is still quarantined. Drop both groups once the window has passed
  # (~2026-08-30); `pnpm install` keeps working unchanged afterwards.
  #
  # next 16.3.3 (published 2026-08-25) — August 2026 security release:
  #   unauthenticated RCE in the Image Optimization API via AVIF
  #   (GHSA-2xp9-vwfh-vxw4) and unauthenticated RCE on Windows hosts
  #   (CVE-2026-75604). The security fix outweighs the quarantine. The
  #   `@next/*` entries are the platform binaries next resolves to.
  - "@next/env@16.3.3"
  - "@next/swc-darwin-arm64@16.3.3"
  - "@next/swc-darwin-x64@16.3.3"
  - "@next/swc-linux-arm64-gnu@16.3.3"
  - "@next/swc-linux-arm64-musl@16.3.3"
  - "@next/swc-linux-x64-gnu@16.3.3"
  - "@next/swc-linux-x64-musl@16.3.3"
  - "@next/swc-win32-arm64-msvc@16.3.3"
  - "@next/swc-win32-x64-msvc@16.3.3"
  - "next@16.3.3"
  #
  # @strapi/* 5.52.2 (published 2026-08-26) — latest patch, pinned across
  # apps/strapi and packages/strapi-types so every Strapi package matches.
  - "@strapi/admin@5.52.2"
  - "@strapi/cloud-cli@5.52.2"
  - "@strapi/content-manager@5.52.2"
  - "@strapi/content-releases@5.52.2"
  - "@strapi/content-type-builder@5.52.2"
  - "@strapi/core@5.52.2"
  - "@strapi/data-transfer@5.52.2"
  - "@strapi/database@5.52.2"
  - "@strapi/email@5.52.2"
  - "@strapi/generators@5.52.2"
  - "@strapi/i18n@5.52.2"
  - "@strapi/logger@5.52.2"
  - "@strapi/openapi@5.52.2"
  - "@strapi/permissions@5.52.2"
  - "@strapi/plugin-sentry@5.52.2"
  - "@strapi/plugin-users-permissions@5.52.2"
  - "@strapi/provider-email-mailgun@5.52.2"
  - "@strapi/provider-email-nodemailer@5.52.2"
  - "@strapi/provider-email-sendmail@5.52.2"
  - "@strapi/provider-upload-aws-s3@5.52.2"
  - "@strapi/provider-upload-local@5.52.2"
  - "@strapi/review-workflows@5.52.2"
  - "@strapi/strapi@5.52.2"
  - "@strapi/types@5.52.2"
  - "@strapi/typescript-utils@5.52.2"
  - "@strapi/upload@5.52.2"
  - "@strapi/utils@5.52.2"

overrides:
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  "@codemirror/state": 6.7.1
  "@codemirror/view": 6.43.9
  # Transitive-only security bumps. None of these is a direct dependency of a
  # workspace package, so they can only be raised through an override:
  #   postcss   - restricts previous-source-map loading to the `opts.from`
  #               folder and fixes prototype hijacking in `postcss.fromJSON()`
  #               (8.5.17/8.5.18/8.5.23). Reached via the Tailwind and webpack
  #               chains, which allow any ^8.4.
  #   dompurify - fixes hook removal, clone-guard bypass and DOM clobbering
  #               via `ownerDocument` during IN_PLACE sanitization (3.4.13).
  #               Reached via mermaid in apps/docs.
  #   hono      - fixes cross-user SSR data disclosure in `memo()`, a Connection
  #               header leak in the proxy helper and ReDoS in the language and
  #               CORS middlewares (all patched in 4.12.34). Reached via
  #               @modelcontextprotocol/sdk, which allows any ^4.11.4.
  #   @hono/...  - fixes serve-static path traversal on Windows via an encoded
  #               backslash (patched in 1.19.15). Held at 1.x on purpose: the
  #               2.x line is a major the MCP SDK has not moved to.
  # Drop each entry once every parent resolves to the patched version on its own.
  postcss: 8.5.26
  dompurify: 3.4.14
  hono: 4.13.4
  "@hono/node-server": 1.19.17

packageExtensions:
  "@hookform/resolvers":
    peerDependencies:
      zod: "*"
  "@uiw/codemirror-extensions-basic-setup":
    peerDependenciesMeta:
      "@codemirror/autocomplete":
        optional: true
      "@codemirror/language":
        optional: true
      "@codemirror/lint":
        optional: true
      "@codemirror/search":
        optional: true
      "@codemirror/state":
        optional: true
      "@codemirror/view":
        optional: true
  "@uiw/react-codemirror":
    peerDependenciesMeta:
      "@babel/runtime":
        optional: true
      "@codemirror/state":
        optional: true
      "@codemirror/theme-one-dark":
        optional: true
      "@codemirror/view":
        optional: true
      codemirror:
        optional: true

peerDependencyRules:
  allowedVersions:
    eslint: ^9.39.0
    react: ">=18 <20"
    react-dom: ">=18 <20"
    styled-components: ">=6.0.0 <7"
    typescript: ">=5.4.0 <6"
    zod: ">=3.25.67 <5"
