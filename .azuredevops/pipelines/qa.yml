trigger: none
pr: none
name: QA-Tests-$(Date:yyyyMMdd)
appendCommitMessageToRunName: false

# Uncomment the schedule trigger to run tests automatically on weekdays.
# schedules:
# Runs at 00:00 UTC on weekdays (02:00 CEST).
# - cron: "0 0 * * 1-5"

parameters:
  - name: run_e2e
    displayName: "E2E tests"
    type: boolean
    default: false

  - name: run_axe
    displayName: "AXE tests"
    type: boolean
    default: false

  - name: run_seo
    displayName: "SEO tests"
    type: boolean
    default: false

  - name: run_web_vitals
    displayName: "Core Web Vitals (k6)"
    type: boolean
    default: false

  - name: run_visual
    displayName: "Visual tests"
    type: boolean
    default: false

  - name: base_url
    displayName: "Base URL to test against (must include protocol). Leave empty to use the default BASE_URL variable."
    type: string
    default: ""

  - name: groups
    displayName: "Test groups (auto = what helpers/test-groups.ts lists for the target env)"
    type: stringList
    default:
      - auto
    values:
      - auto
      - homepage
      - auth

variables:
  - group: qa-pipeline-vars # must define a BASE_URL variable
  - name: CI
    value: "true"
  - name: NPM_CONFIG_IGNORE_SCRIPTS
    value: "true"
  # Non-secret pipeline variables reach every script as env vars, so Playwright
  # and the k6 scripts read QA_GROUPS directly. "auto" means the env default.
  - name: QA_GROUPS
    value: ${{ join(',', parameters.groups) }}

pool:
  vmImage: "ubuntu-latest"

jobs:
  - job: set_run_name
    displayName: Set run name
    steps:
      - bash: |
          set -e
          if [ "$(Build.Reason)" = "Schedule" ]; then
            LABEL="SCHEDULED"
          else
            LABELS=()
            [ "${{ parameters.run_e2e }}" = "True" ] && LABELS+=("E2E")
            [ "${{ parameters.run_axe }}" = "True" ] && LABELS+=("AXE")
            [ "${{ parameters.run_seo }}" = "True" ] && LABELS+=("SEO")
            [ "${{ parameters.run_web_vitals }}" = "True" ] && LABELS+=("Vitals")
            [ "${{ parameters.run_visual }}" = "True" ] && LABELS+=("Visual")
            LABEL=$(IFS=', '; echo "${LABELS[*]}")
          fi
          BASE_URL_INPUT="$PARAM_BASE_URL"
          if [ -z "$BASE_URL_INPUT" ]; then
            BASE_URL_INPUT="default-baseurl"
          fi
          SAFE_BASE_URL=$(echo "$BASE_URL_INPUT" | sed -E 's#^[a-zA-Z]+://##; s#[/:\\"'"'"'<>|?@*]+#-#g')
          echo "##vso[build.updatebuildnumber][$LABEL] QA - $SAFE_BASE_URL - $(QA_GROUPS)"
        displayName: Compute run name
        env:
          PARAM_BASE_URL: ${{ parameters.base_url }}

  - job: e2e
    displayName: "Playwright E2E tests"
    condition: and(succeeded(), eq(${{ parameters.run_e2e }}, true))
    timeoutInMinutes: 30
    steps:
      - checkout: self
        fetchDepth: 1

      - template: ../templates/steps/setup-pnpm.yaml

      - script: |
          set -e
          RESOLVED_BASE_URL="$PARAM_BASE_URL"
          if [ -z "$RESOLVED_BASE_URL" ]; then
            RESOLVED_BASE_URL="$FALLBACK_BASE_URL"
          fi
          echo "##vso[task.setvariable variable=BASE_URL]$RESOLVED_BASE_URL"
        displayName: Resolve BASE_URL
        env:
          PARAM_BASE_URL: ${{ parameters.base_url }}
          FALLBACK_BASE_URL: $(BASE_URL)

      - task: Cache@2
        inputs:
          key: 'playwright | "$(Agent.OS)" | pnpm-lock.yaml'
          restoreKeys: |
            playwright | "$(Agent.OS)"
          path: $(HOME)/.cache/ms-playwright
        displayName: Cache Playwright browsers

      - bash: |
          set -eux
          pnpm -F @repo/tests-playwright exec playwright install --with-deps
        displayName: "Install Playwright browsers"

      - bash: |
          pnpm tests:playwright:e2e:test
        displayName: "Run Playwright E2E tests"
        env:
          BASE_URL: $(BASE_URL)
          CI: "true"

      - task: PublishBuildArtifacts@1
        displayName: "Publish Playwright report"
        condition: failed()
        inputs:
          pathToPublish: "qa/tests/playwright/playwright-report"
          artifactName: "playwright-report"
          publishLocation: "Container"

      - bash: |
          set -e
          mkdir -p "$(Build.ArtifactStagingDirectory)/traces"
          cd qa/tests/playwright
          find test-results -name 'trace.zip' | tar -cf - -T - | tar -xf - -C "$(Build.ArtifactStagingDirectory)/traces"
        displayName: Collect Playwright traces
        condition: failed()

      - task: PublishBuildArtifacts@1
        condition: failed()
        inputs:
          pathToPublish: "$(Build.ArtifactStagingDirectory)/traces"
          artifactName: "playwright-traces"
          publishLocation: "Container"

  - job: axe
    displayName: "Playwright AXE tests"
    condition: and(succeeded(), eq(${{ parameters.run_axe }}, true))
    timeoutInMinutes: 15
    steps:
      - checkout: self
        fetchDepth: 1

      - template: ../templates/steps/setup-pnpm.yaml

      - script: |
          set -e
          RESOLVED_BASE_URL="$PARAM_BASE_URL"
          if [ -z "$RESOLVED_BASE_URL" ]; then
            RESOLVED_BASE_URL="$FALLBACK_BASE_URL"
          fi
          echo "##vso[task.setvariable variable=BASE_URL]$RESOLVED_BASE_URL"
        displayName: Resolve BASE_URL
        env:
          PARAM_BASE_URL: ${{ parameters.base_url }}
          FALLBACK_BASE_URL: $(BASE_URL)

      - task: Cache@2
        inputs:
          key: 'playwright | "$(Agent.OS)" | pnpm-lock.yaml'
          restoreKeys: |
            playwright | "$(Agent.OS)"
          path: $(HOME)/.cache/ms-playwright
        displayName: Cache Playwright browsers

      - bash: |
          set -eux
          pnpm -F @repo/tests-playwright exec playwright install --with-deps
        displayName: "Install Playwright browsers"

      - bash: |
          pnpm tests:playwright:axe
        displayName: "Run Axe tests"
        env:
          BASE_URL: $(BASE_URL)
          CI: "true"

      - bash: |
          tar -czf axe-reports-$(Build.BuildId).tgz \
            -C qa/tests/playwright \
            playwright-report
        displayName: "Pack Axe reports"
        condition: failed()

      - task: PublishBuildArtifacts@1
        displayName: "Publish Axe report"
        condition: failed()
        inputs:
          pathToPublish: "axe-reports-$(Build.BuildId).tgz"
          artifactName: "axe-report"
          publishLocation: "Container"

  - job: seo
    displayName: "Playwright SEO tests"
    condition: and(succeeded(), eq(${{ parameters.run_seo }}, true))
    timeoutInMinutes: 30
    steps:
      - checkout: self
        fetchDepth: 1

      - template: ../templates/steps/setup-pnpm.yaml

      - script: |
          set -e
          RESOLVED_BASE_URL="$PARAM_BASE_URL"
          if [ -z "$RESOLVED_BASE_URL" ]; then
            RESOLVED_BASE_URL="$FALLBACK_BASE_URL"
          fi
          echo "##vso[task.setvariable variable=BASE_URL]$RESOLVED_BASE_URL"
        displayName: Resolve BASE_URL
        env:
          PARAM_BASE_URL: ${{ parameters.base_url }}
          FALLBACK_BASE_URL: $(BASE_URL)

      - task: Cache@2
        inputs:
          key: 'playwright | "$(Agent.OS)" | pnpm-lock.yaml'
          restoreKeys: |
            playwright | "$(Agent.OS)"
          path: $(HOME)/.cache/ms-playwright
        displayName: Cache Playwright browsers

      - bash: |
          set -eux
          pnpm -F @repo/tests-playwright exec playwright install --with-deps
        displayName: "Install Playwright browsers"

      - bash: |
          pnpm tests:playwright:seo
        displayName: "Run Playwright SEO tests"
        env:
          BASE_URL: $(BASE_URL)
          CI: "true"

      - bash: |
          tar -czf seo-reports-$(Build.BuildId).tgz \
            -C qa/tests/playwright \
            playwright-report
        displayName: "Pack SEO reports"
        condition: failed()

      - task: PublishBuildArtifacts@1
        displayName: "Publish SEO report"
        condition: failed()
        inputs:
          pathToPublish: "seo-reports-$(Build.BuildId).tgz"
          artifactName: "seo-report"
          publishLocation: "Container"

  - job: visual
    displayName: "Playwright Visual tests"
    condition: and(succeeded(), eq(${{ parameters.run_visual }}, true))
    timeoutInMinutes: 15
    steps:
      - checkout: self
        fetchDepth: 1

      - template: ../templates/steps/setup-pnpm.yaml

      - bash: |
          VERSION="$(node -p "require('./qa/tests/playwright/node_modules/@playwright/test/package.json').version")"
          echo "##vso[task.setvariable variable=PLAYWRIGHT_VERSION]$VERSION"
        displayName: Resolve Playwright version

      - bash: |
          set -e
          if find qa/tests/playwright/visual/visual.spec.ts-snapshots -type f -name '*.png' 2>/dev/null | grep -q .; then
            echo "Baseline snapshots found."
            echo "##vso[task.setvariable variable=HAS_BASELINES]true"
          else
            echo "No baseline snapshots found under qa/tests/playwright/visual/visual.spec.ts-snapshots - skipping visual regression run."
            echo "##vso[task.setvariable variable=HAS_BASELINES]false"
          fi
        displayName: Check for baseline snapshots

      - script: |
          set -e
          RESOLVED_BASE_URL="$PARAM_BASE_URL"
          if [ -z "$RESOLVED_BASE_URL" ]; then
            RESOLVED_BASE_URL="$FALLBACK_BASE_URL"
          fi
          echo "##vso[task.setvariable variable=BASE_URL]$RESOLVED_BASE_URL"
        condition: and(succeeded(), eq(variables['HAS_BASELINES'], 'true'))
        displayName: Resolve BASE_URL
        env:
          PARAM_BASE_URL: ${{ parameters.base_url }}
          FALLBACK_BASE_URL: $(BASE_URL)

      - task: Cache@2
        condition: and(succeeded(), eq(variables['HAS_BASELINES'], 'true'))
        inputs:
          key: '"docker-playwright-v$(PLAYWRIGHT_VERSION)-noble"'
          path: /tmp/docker-playwright-cache
        displayName: Cache Playwright Docker image

      - bash: |
          set -e
          IMAGE="mcr.microsoft.com/playwright:v$(PLAYWRIGHT_VERSION)-noble"
          CACHE_FILE="/tmp/docker-playwright-cache/playwright.tar"
          if [ -f "$CACHE_FILE" ]; then
            echo "Loading Docker image from cache..."
            docker load -i "$CACHE_FILE"
          else
            echo "Pulling Docker image..."
            docker pull "$IMAGE"
            mkdir -p /tmp/docker-playwright-cache
            docker save "$IMAGE" -o "$CACHE_FILE"
          fi
        condition: and(succeeded(), eq(variables['HAS_BASELINES'], 'true'))
        displayName: Load or pull Playwright Docker image

      - script: pnpm tests:playwright:visual:docker
        condition: and(succeeded(), eq(variables['HAS_BASELINES'], 'true'))
        displayName: Run Visual tests
        env:
          BASE_URL: $(BASE_URL)
          CI: "true"

      - bash: |
          tar -czf visual-reports-$(Build.BuildId).tgz \
            -C qa/tests/playwright \
            playwright-report
        displayName: "Pack Visual reports"
        condition: failed()

      - task: PublishBuildArtifacts@1
        displayName: "Publish Visual report"
        condition: failed()
        inputs:
          pathToPublish: "visual-reports-$(Build.BuildId).tgz"
          artifactName: "visual-report"
          publishLocation: "Container"

  - job: web_vitals
    displayName: "Core Web Vitals (k6)"
    condition: and(succeeded(), eq(${{ parameters.run_web_vitals }}, true), ne(variables['Build.Reason'], 'Schedule'))
    timeoutInMinutes: 20
    variables:
      K6_VERSION: "2.3.0"
      HISTORY_BRANCH: qa/web-vitals-history
      HISTORY_FILE: qa/tests/playwright/perfo/web-vitals-history.md
    steps:
      - checkout: self
        fetchDepth: 1
        # Lets the job push the trend row. The build service needs Contribute
        # and Create branch on this repository.
        persistCredentials: true

      - template: ../templates/steps/setup-pnpm.yaml

      - script: |
          set -e
          RESOLVED_BASE_URL="$PARAM_BASE_URL"
          if [ -z "$RESOLVED_BASE_URL" ]; then
            RESOLVED_BASE_URL="$FALLBACK_BASE_URL"
          fi
          echo "##vso[task.setvariable variable=BASE_URL]$RESOLVED_BASE_URL"
        displayName: Resolve BASE_URL
        env:
          PARAM_BASE_URL: ${{ parameters.base_url }}
          FALLBACK_BASE_URL: $(BASE_URL)

      # The hosted ubuntu image ships Google Chrome, which the k6 browser module uses.
      - bash: |
          set -e
          K6_DIR="$(Agent.ToolsDirectory)/k6-$(K6_VERSION)"
          mkdir -p "$K6_DIR"
          curl -fsSL "https://github.com/grafana/k6/releases/download/v$(K6_VERSION)/k6-v$(K6_VERSION)-linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C "$K6_DIR" "k6-v$(K6_VERSION)-linux-amd64/k6"
          "$K6_DIR/k6" version
          echo "##vso[task.prependpath]$K6_DIR"
        displayName: "Install k6"

      # The trend lives on its own branch, never in dev. Bring in what's there
      # so the run appends to it; the first run starts the file.
      - bash: |
          if git fetch --depth=1 origin "$(HISTORY_BRANCH)"; then
            git show "FETCH_HEAD:$(HISTORY_FILE)" > "$(HISTORY_FILE)" || rm -f "$(HISTORY_FILE)"
          else
            echo "No $(HISTORY_BRANCH) branch yet, this run starts the history."
          fi
        displayName: "Fetch Core Web Vitals history"

      - bash: |
          pnpm tests:k6:vitals
        displayName: "Run Core Web Vitals"
        env:
          BASE_URL: $(BASE_URL)
          CI: "true"

      - task: PublishBuildArtifacts@1
        displayName: "Publish Core Web Vitals report"
        condition: always()
        inputs:
          pathToPublish: "qa/tests/playwright/perfo/report.html"
          artifactName: "web-vitals-report"
          publishLocation: "Container"

      # A failing run is part of the trend too. Two runs at once can't both
      # push: the second fails with a non-fast-forward error and can be re-run.
      - bash: |
          set -e
          if [ ! -f "$(HISTORY_FILE)" ]; then
            echo "The test wrote no history, nothing to record."
            exit 0
          fi
          INVESTIGATIONS="$(dirname "$(HISTORY_FILE)")/investigations"
          # Move this run's files aside: switching branches must not touch them.
          mkdir -p "$(Agent.TempDirectory)/web-vitals/investigations"
          cp "$(HISTORY_FILE)" "$(Agent.TempDirectory)/web-vitals/history.md"
          cp "$INVESTIGATIONS"/*.md "$(Agent.TempDirectory)/web-vitals/investigations/" 2>/dev/null || true
          rm -f "$(HISTORY_FILE)" "$INVESTIGATIONS"/*.md
          git config user.name "Azure Pipelines"
          git config user.email "azure-pipelines@noreply.local"
          if git fetch --depth=1 origin "$(HISTORY_BRANCH)"; then
            git switch -C "$(HISTORY_BRANCH)" FETCH_HEAD
          else
            # First run: a branch holding nothing but the history and investigations.
            git switch --orphan "$(HISTORY_BRANCH)"
          fi
          mkdir -p "$INVESTIGATIONS"
          cp "$(Agent.TempDirectory)/web-vitals/history.md" "$(HISTORY_FILE)"
          cp "$(Agent.TempDirectory)/web-vitals/investigations/"*.md "$INVESTIGATIONS/" 2>/dev/null || true
          # -f: these files are gitignored on code branches, tracked only here.
          git add -f "$(HISTORY_FILE)" "$INVESTIGATIONS"
          git commit -m "chore(qa): record Core Web Vitals for $BASE_URL" \
            -m "Run: $(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)" \
            || { echo "No new rows to record."; exit 0; }
          git push origin "$(HISTORY_BRANCH)"
        displayName: "Save Core Web Vitals history"
        condition: succeededOrFailed()
        env:
          BASE_URL: $(BASE_URL)
          LEFTHOOK: "0"
