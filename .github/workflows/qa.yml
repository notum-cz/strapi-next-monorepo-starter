name: QA

run-name: >-
  [${{
    github.event_name == 'schedule' && 'SCHEDULED' ||
    inputs.run_e2e && 'E2E' ||
    inputs.run_axe && 'AXE' ||
    inputs.run_seo && 'SEO' ||
    inputs.run_lhci_perfo && 'Perfo' ||
    inputs.run_visual && 'Visual'
  }}${{
    github.event_name != 'schedule' && inputs.run_e2e && inputs.run_axe && ', AXE' || ''
  }}${{
    github.event_name != 'schedule' && (inputs.run_e2e || inputs.run_axe) && inputs.run_seo && ', SEO' || ''
  }}${{
    github.event_name != 'schedule' && (inputs.run_e2e || inputs.run_axe || inputs.run_seo) && inputs.run_lhci_perfo && ', Perfo' || ''
  }}${{
    github.event_name != 'schedule' && (inputs.run_e2e || inputs.run_axe || inputs.run_seo || inputs.run_lhci_perfo) && inputs.run_visual && ', Visual' || ''
  }}] QA – ${{ inputs.base_url || vars.BASE_URL || 'missing-base-url' }}

on:
  # Uncomment the schedule trigger to run tests automatically on weekdays.
  # schedule:
    # Runs at 00:00 UTC on weekdays (02:00 CEST).
    # - cron: "0 0 * * 1-5"
  workflow_dispatch:
    inputs:
      run_e2e:
        description: E2E tests
        type: boolean
        default: false
      run_axe:
        description: AXE tests
        type: boolean
        default: false
      run_seo:
        description: SEO tests
        type: boolean
        default: false
      run_lhci_perfo:
        description: LHCI Performance tests
        type: boolean
        default: false
      run_visual:
        description: Visual tests
        type: boolean
        default: false
      base_url:
        description: "Base URL to test against (must include protocol). Leave empty to use the default BASE_URL variable."
        type: string
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NPM_CONFIG_IGNORE_SCRIPTS: "true"
  BASE_URL: ${{ inputs.base_url || vars.BASE_URL }}

jobs:
  e2e:
    if: ${{ inputs.run_e2e }}
    name: Playwright E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm with cache
        uses: ./.github/actions/setup-pnpm

      - name: Cache Playwright browsers
        uses: actions/cache@v6.0.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: pnpm -F @repo/tests-playwright exec playwright install --with-deps

      - name: Run Playwright tests
        env:
          BASE_URL: ${{ env.BASE_URL }}
        run: pnpm tests:playwright:e2e:test

      - name: Publish Playwright report
        uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: qa/tests/playwright/playwright-report/**
          retention-days: 7
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: qa/tests/playwright/test-results/**/trace.zip
          retention-days: 7
          if-no-files-found: warn

  axe:
    if: ${{ inputs.run_axe }}
    name: Playwright AXE tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm with cache
        uses: ./.github/actions/setup-pnpm

      - name: Cache Playwright browsers
        uses: actions/cache@v6.0.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: pnpm -F @repo/tests-playwright exec playwright install --with-deps

      - name: Run Axe tests
        env:
          BASE_URL: ${{ env.BASE_URL }}
        run: pnpm tests:playwright:axe

      - name: Pack Axe reports
        if: failure()
        run: |
          tar -czf axe-reports-${{ github.run_id }}.tgz \
            -C qa/tests/playwright \
            playwright-report

      - name: Publish Axe report
        uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: axe-report
          path: axe-reports-${{ github.run_id }}.tgz
          retention-days: 7
          if-no-files-found: warn

  seo:
    if: ${{ inputs.run_seo }}
    name: Playwright SEO tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm with cache
        uses: ./.github/actions/setup-pnpm

      - name: Cache Playwright browsers
        uses: actions/cache@v6.0.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: pnpm -F @repo/tests-playwright exec playwright install --with-deps

      - name: Run Playwright SEO tests
        env:
          BASE_URL: ${{ env.BASE_URL }}
        run: pnpm tests:playwright:seo

      - name: Pack SEO reports
        if: failure()
        run: |
          tar -czf seo-reports-${{ github.run_id }}.tgz \
            -C qa/tests/playwright \
            playwright-report

      - name: Publish SEO report
        uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: seo-report
          path: seo-reports-${{ github.run_id }}.tgz
          retention-days: 7
          if-no-files-found: warn

  visual:
    if: ${{ inputs.run_visual }}
    name: Playwright Visual tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm with cache
        uses: ./.github/actions/setup-pnpm

      - name: Resolve Playwright version
        id: playwright_version
        run: |
          VERSION="$(node -p "require('./qa/tests/playwright/node_modules/@playwright/test/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for baseline snapshots
        id: baseline_check
        run: |
          if find qa/tests/playwright/visual/visual.spec.ts-snapshots -type f -name '*.png' 2>/dev/null | grep -q .; then
            echo "Baseline snapshots found."
            echo "has_baselines=true" >> "$GITHUB_OUTPUT"
          else
            echo "No baseline snapshots found under qa/tests/playwright/visual/visual.spec.ts-snapshots - skipping visual regression run."
            echo "has_baselines=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Playwright Docker image
        id: docker-cache
        if: steps.baseline_check.outputs.has_baselines == 'true'
        uses: actions/cache@v6.0.0
        with:
          path: /tmp/docker-playwright-cache
          key: docker-playwright-v${{ steps.playwright_version.outputs.version }}-noble

      - name: Load or pull Playwright Docker image
        if: steps.baseline_check.outputs.has_baselines == 'true'
        run: |
          IMAGE="mcr.microsoft.com/playwright:v${{ steps.playwright_version.outputs.version }}-noble"
          CACHE_FILE="/tmp/docker-playwright-cache/playwright.tar"
          if [[ -f "$CACHE_FILE" ]]; then
            echo "Loading Docker image from cache..."
            docker load -i "$CACHE_FILE"
          else
            echo "Pulling Docker image..."
            docker pull "$IMAGE"
            mkdir -p /tmp/docker-playwright-cache
            docker save "$IMAGE" -o "$CACHE_FILE"
          fi

      - name: Run Visual tests
        if: steps.baseline_check.outputs.has_baselines == 'true'
        env:
          BASE_URL: ${{ env.BASE_URL }}
        run: pnpm tests:playwright:visual:docker

      - name: Pack Visual reports
        if: failure()
        run: |
          tar -czf visual-reports-${{ github.run_id }}.tgz \
            -C qa/tests/playwright \
            playwright-report

      - name: Publish Visual report
        uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: visual-report
          path: visual-reports-${{ github.run_id }}.tgz
          retention-days: 7
          if-no-files-found: warn

  lhci_perfo:
    if: ${{ inputs.run_lhci_perfo }}
    name: LHCI Performance tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm with cache
        uses: ./.github/actions/setup-pnpm

      - name: Run LHCI Performance tests
        env:
          BASE_URL: ${{ env.BASE_URL }}
        run: pnpm tests:lhci:perfo

      - name: Open PR with Lighthouse trend history
        if: success()
        uses: peter-evans/create-pull-request@v8.1.1
        env:
          # peter-evans/create-pull-request commits on an internal branch with a
          # generated name that never matches this repo's <type>/STAR-<n>-<desc>
          # branch-naming convention, which would otherwise fail Lefthook's
          # pre-commit hook (scripts/validate-branch-name.sh).
          LEFTHOOK: "0"
        with:
          add-paths: qa/tests/playwright/perfo/lighthouse-history.md
          commit-message: "chore(tests-playwright): record Lighthouse trend results"
          branch: qa/lighthouse-trend-update
          delete-branch: true
          title: "chore(qa): update Lighthouse trend history"
          labels: QA, auto-generated
          body: |
            Automated update of the Lighthouse performance trend log (`qa/tests/playwright/perfo/lighthouse-history.md`) from a manual QA workflow run.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Pack LHCI reports
        if: always()
        run: |
          tar -czf lhci-perfo-reports-${{ github.run_id }}.tgz \
            -C qa/tests/playwright/perfo/.lighthouseci .

      - name: Publish LHCI report
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: perfo-report
          path: lhci-perfo-reports-${{ github.run_id }}.tgz
          retention-days: 7
          if-no-files-found: warn
