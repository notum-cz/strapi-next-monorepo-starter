name: QA

run-name: >-
  [${{
    github.event.schedule == '0 3 * * 1' && 'SCHEDULED Vitals' ||
    github.event_name == 'schedule' && 'SCHEDULED' ||
    inputs.run_e2e && 'E2E' ||
    inputs.run_axe && 'AXE' ||
    inputs.run_seo && 'SEO' ||
    inputs.run_web_vitals && 'Vitals' ||
    inputs.run_visual && 'Visual'
  }}${{
    github.event_name != 'schedule' && inputs.run_e2e && inputs.run_axe && ', AXE' || ''
  }}${{
    github.event_name != 'schedule' && (inputs.run_e2e || inputs.run_axe) && inputs.run_seo && ', SEO' || ''
  }}${{
    github.event_name != 'schedule' && (inputs.run_e2e || inputs.run_axe || inputs.run_seo) && inputs.run_web_vitals && ', Vitals' || ''
  }}${{
    github.event_name != 'schedule' && (inputs.run_e2e || inputs.run_axe || inputs.run_seo || inputs.run_web_vitals) && inputs.run_visual && ', Visual' || ''
  }}] QA – ${{ inputs.base_url || vars.BASE_URL || 'missing-base-url' }} – ${{ inputs.groups || 'auto' }}

on:
  # Uncomment the schedule trigger to run tests automatically.
  # schedule:
    # Core Web Vitals once a week: Mondays at 03:00 UTC (05:00 CEST). The
    # web_vitals job and run-name match this exact string, so keep them in sync.
    # - cron: "0 3 * * 1"
    # Runs at 00:00 UTC on weekdays (02:00 CEST).
    # - cron: "0 0 * * 1-5"
  workflow_dispatch:
    inputs:
      run_e2e:
        description: E2E tests
        type: boolean
        default: false
      run_axe:
        description: AXE tests
        type: boolean
        default: false
      run_seo:
        description: SEO tests
        type: boolean
        default: false
      run_web_vitals:
        description: Core Web Vitals (k6)
        type: boolean
        default: false
      run_visual:
        description: Visual tests
        type: boolean
        default: false
      base_url:
        description: "Base URL to test against (must include protocol). Leave empty to use the default BASE_URL variable."
        type: string
        required: false
        default: ""
      groups:
        description: "Test groups, comma-separated (homepage, auth). auto = what helpers/test-groups.ts lists for the target env."
        type: string
        required: false
        default: auto

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NPM_CONFIG_IGNORE_SCRIPTS: "true"
  BASE_URL: ${{ inputs.base_url || vars.BASE_URL }}
  # Read by playwright.config.ts and the k6 scripts (helpers/k6/target.ts). Empty on a scheduled run, which means auto.
  QA_GROUPS: ${{ inputs.groups }}

jobs:
  e2e:
    if: ${{ inputs.run_e2e }}
    name: Playwright E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm with cache
        uses: ./.github/actions/setup-pnpm

      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: pnpm -F @repo/tests-playwright exec playwright install --with-deps

      - name: Run Playwright tests
        env:
          BASE_URL: ${{ env.BASE_URL }}
        run: pnpm tests:playwright:e2e:test

      - name: Publish Playwright report
        uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: qa/tests/playwright/playwright-report/**
          retention-days: 7
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: qa/tests/playwright/test-results/**/trace.zip
          retention-days: 7
          if-no-files-found: warn

  axe:
    if: ${{ inputs.run_axe }}
    name: Playwright AXE tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm with cache
        uses: ./.github/actions/setup-pnpm

      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: pnpm -F @repo/tests-playwright exec playwright install --with-deps chromium

      - name: Run Axe tests
        env:
          BASE_URL: ${{ env.BASE_URL }}
        run: pnpm tests:playwright:axe

      - name: Pack Axe reports
        if: failure()
        run: |
          tar -czf axe-reports-${{ github.run_id }}.tgz \
            -C qa/tests/playwright \
            playwright-report

      - name: Publish Axe report
        uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: axe-report
          path: axe-reports-${{ github.run_id }}.tgz
          retention-days: 7
          if-no-files-found: warn

  seo:
    if: ${{ inputs.run_seo }}
    name: Playwright SEO tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm with cache
        uses: ./.github/actions/setup-pnpm

      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: pnpm -F @repo/tests-playwright exec playwright install --with-deps chromium

      - name: Run Playwright SEO tests
        env:
          BASE_URL: ${{ env.BASE_URL }}
        run: pnpm tests:playwright:seo

      - name: Pack SEO reports
        if: failure()
        run: |
          tar -czf seo-reports-${{ github.run_id }}.tgz \
            -C qa/tests/playwright \
            playwright-report

      - name: Publish SEO report
        uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: seo-report
          path: seo-reports-${{ github.run_id }}.tgz
          retention-days: 7
          if-no-files-found: warn

  visual:
    if: ${{ inputs.run_visual }}
    name: Playwright Visual tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm with cache
        uses: ./.github/actions/setup-pnpm

      - name: Resolve Playwright version
        id: playwright_version
        run: |
          VERSION="$(node -p "require('./qa/tests/playwright/node_modules/@playwright/test/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for baseline snapshots
        id: baseline_check
        run: |
          if find qa/tests/playwright/visual/visual.spec.ts-snapshots -type f -name '*.png' 2>/dev/null | grep -q .; then
            echo "Baseline snapshots found."
            echo "has_baselines=true" >> "$GITHUB_OUTPUT"
          else
            echo "No baseline snapshots found under qa/tests/playwright/visual/visual.spec.ts-snapshots - skipping visual regression run."
            echo "has_baselines=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Playwright Docker image
        id: docker-cache
        if: steps.baseline_check.outputs.has_baselines == 'true'
        uses: actions/cache@v6.1.0
        with:
          path: /tmp/docker-playwright-cache
          key: docker-playwright-v${{ steps.playwright_version.outputs.version }}-noble

      - name: Load or pull Playwright Docker image
        if: steps.baseline_check.outputs.has_baselines == 'true'
        run: |
          IMAGE="mcr.microsoft.com/playwright:v${{ steps.playwright_version.outputs.version }}-noble"
          CACHE_FILE="/tmp/docker-playwright-cache/playwright.tar"
          if [[ -f "$CACHE_FILE" ]]; then
            echo "Loading Docker image from cache..."
            docker load -i "$CACHE_FILE"
          else
            echo "Pulling Docker image..."
            docker pull "$IMAGE"
            mkdir -p /tmp/docker-playwright-cache
            docker save "$IMAGE" -o "$CACHE_FILE"
          fi

      - name: Run Visual tests
        if: steps.baseline_check.outputs.has_baselines == 'true'
        env:
          BASE_URL: ${{ env.BASE_URL }}
        run: pnpm tests:playwright:visual:docker

      - name: Pack Visual reports
        if: failure()
        run: |
          tar -czf visual-reports-${{ github.run_id }}.tgz \
            -C qa/tests/playwright \
            playwright-report

      - name: Publish Visual report
        uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: visual-report
          path: visual-reports-${{ github.run_id }}.tgz
          retention-days: 7
          if-no-files-found: warn

  web_vitals:
    # By hand, or from the weekly cron above (not the weekday one).
    if: ${{ inputs.run_web_vitals || github.event.schedule == '0 3 * * 1' }}
    name: Core Web Vitals (k6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Pushes the trend row to the qa/web-vitals-history branch.
      contents: write
    # Runs queue instead of racing; `queue: max` keeps every pending run (up
    # to 100) instead of only the newest. The Save step also refuses to write
    # when the branch moved during the run, so no history row is overwritten.
    concurrency:
      group: web-vitals-history
      cancel-in-progress: false
      queue: max
    env:
      HISTORY_BRANCH: qa/web-vitals-history
      HISTORY_FILE: qa/tests/playwright/perfo/web-vitals-history.md

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm with cache
        uses: ./.github/actions/setup-pnpm

      - name: Setup k6 with browser support
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: "2.3.0"
          browser: true

      # The trend lives on its own branch, never in dev. Bring in what's there
      # so the run appends to it; the first run starts the file. HISTORY_BASE
      # remembers which commit the run builds on, for the Save step.
      - name: Fetch Core Web Vitals history
        run: |
          # Exit code 2 = the branch doesn't exist yet. Any other failure must
          # stop the job: taken for "no history", it would push a history
          # holding only this run's rows.
          status=0
          git ls-remote --exit-code --heads origin "$HISTORY_BRANCH" > /dev/null || status=$?
          if [ "$status" -eq 2 ]; then
            echo "No $HISTORY_BRANCH branch yet, this run starts the history."
            echo "HISTORY_BASE=none" >> "$GITHUB_ENV"
            exit 0
          elif [ "$status" -ne 0 ]; then
            echo "Couldn't read $HISTORY_BRANCH (git ls-remote exited $status)." >&2
            exit 1
          fi
          git fetch --depth=1 origin "$HISTORY_BRANCH"
          echo "HISTORY_BASE=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
          git show "FETCH_HEAD:$HISTORY_FILE" > "$HISTORY_FILE" || rm -f "$HISTORY_FILE"

      - name: Run Core Web Vitals
        env:
          BASE_URL: ${{ env.BASE_URL }}
          # Ubuntu 24.04 runners block the user namespaces Chrome's sandbox
          # needs, so Chrome aborts at launch without this.
          K6_BROWSER_ARGS: no-sandbox
        run: pnpm tests:k6:vitals

      # A failing run is part of the trend too, so this runs on failure as well.
      - name: Save Core Web Vitals history
        if: ${{ !cancelled() }}
        env:
          LEFTHOOK: "0"
        run: |
          set -e
          if [ ! -f "$HISTORY_FILE" ]; then
            echo "The test wrote no history (see the Trend line of the run above), nothing to record."
            exit 0
          fi
          INVESTIGATIONS="$(dirname "$HISTORY_FILE")/investigations"
          # A separate worktree, so the checkout under test stays as it is
          # (later steps, such as the setup-pnpm post step, still need it).
          WORKTREE="$RUNNER_TEMP/web-vitals-history"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The history file holds the rows up to HISTORY_BASE plus this run's.
          # If another run recorded in the meantime, writing it would drop that
          # run's rows, so stop instead: a re-run picks them up.
          if [ "$HISTORY_BASE" = none ]; then
            # First run: a branch holding nothing but the history and investigations.
            # If the branch appeared meanwhile, the push below is rejected.
            git worktree add --orphan -b "$HISTORY_BRANCH" "$WORKTREE"
          else
            git fetch --depth=1 origin "$HISTORY_BRANCH"
            if [ "$(git rev-parse FETCH_HEAD)" != "$HISTORY_BASE" ]; then
              echo "$HISTORY_BRANCH moved during this run; re-run the job to record on top of it." >&2
              exit 1
            fi
            git worktree add -B "$HISTORY_BRANCH" "$WORKTREE" FETCH_HEAD
          fi
          mkdir -p "$WORKTREE/$INVESTIGATIONS"
          cp "$HISTORY_FILE" "$WORKTREE/$HISTORY_FILE"
          cp "$INVESTIGATIONS"/*.md "$WORKTREE/$INVESTIGATIONS/" 2>/dev/null || true
          cd "$WORKTREE"
          # -f: these files are gitignored on code branches, tracked only here.
          git add -f "$HISTORY_FILE" "$INVESTIGATIONS"
          git commit -m "chore(qa): record Core Web Vitals for $BASE_URL" \
            -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || { echo "No new rows to record."; exit 0; }
          git push origin "$HISTORY_BRANCH"

      - name: Publish Core Web Vitals report
        uses: actions/upload-artifact@v7.0.2
        # The report is the result, pass or fail.
        if: always()
        with:
          name: web-vitals-report
          path: qa/tests/playwright/perfo/report.html
          retention-days: 7
          if-no-files-found: warn
