# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Dependabot reads this file from the DEFAULT branch (main) only — changes here
# take effect once they reach main.
#
# Security updates additionally require "Dependabot alerts" and
# "Dependabot security updates" to be enabled in repo Settings → Code security
# (both already enabled). Security PRs are NOT throttled by
# open-pull-requests-limit, ignore `cooldown` and `target-branch` (they always
# target the default branch), and bypass pnpm's `minimumReleaseAge` — so CI
# rejects their lockfile with ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION until the
# new versions are older than `minimumReleaseAge`. Re-run CI after that window.
version: 2

updates:
  # ─────────────────────────────────────────────
  # GitHub Actions
  # ─────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    target-branch: "dev"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      include: scope
      prefix: "ci"
    labels:
      - "update-dependencies"
      - "auto-generated"
      - "ready-for-review"

  # ─────────────────────────────────────────────
  # npm — the whole pnpm workspace from the ROOT ONLY.
  #
  # Do NOT add workspace subdirectories (/apps/*, /packages/*) here. A job that
  # starts in a subdirectory does not find the root pnpm-lock.yaml or the
  # `packageManager` pin, falls back to a guessed pnpm version, and opens PRs
  # that bump package.json only — CI then fails on
  # ERR_PNPM_OUTDATED_LOCKFILE. The root job reads pnpm-workspace.yaml and
  # already covers every workspace package.
  #
  # Because there is a single entry, `ignore` applies to every package.
  # React-major upgrades (apps/ui) are therefore done by hand.
  # ─────────────────────────────────────────────
  - package-ecosystem: "npm"
    target-branch: "dev"
    versioning-strategy: "increase"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    # Wait out fresh releases before opening PRs (skips the buggy x.0.0 rush).
    # Must stay >= pnpm's `minimumReleaseAge` (2 days) or CI rejects the lockfile.
    cooldown:
      default-days: 3
      semver-minor-days: 5
    allow:
      - dependency-type: "direct"
    groups:
      # React ecosystem — kept separate for careful review
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types: ["patch", "minor"]
      # Strapi ecosystem — kept separate for careful review
      strapi:
        patterns:
          - "@strapi/*"
        update-types: ["patch", "minor", "major"]
      # Everything else bundled into a single PR
      all-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@strapi/*"
        update-types: ["patch", "minor", "major"]
    ignore:
      # Strapi v5 admin and Docusaurus 3 require React 18 and react-router-dom 6
      # (peer deps of @strapi/strapi). apps/ui React majors are done by hand.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      # Node types must match the Node runtime major (engines: ^24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      include: scope
      prefix: "chore"
    labels:
      - "update-dependencies"
      - "auto-generated"
      - "ready-for-review"

  # ─────────────────────────────────────────────
  # Docker base images (apps/ui, apps/strapi)
  # ─────────────────────────────────────────────
  - package-ecosystem: "docker"
    target-branch: "dev"
    directories:
      - "/apps/ui"
      - "/apps/strapi"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      include: scope
      prefix: "chore"
    labels:
      - "update-dependencies"
      - "auto-generated"
      - "ready-for-review"
    # Stay on the Node 24 LTS line — never auto-bump the runtime major.
    # Runtime-major moves are a platform decision, not a routine dep bump.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
